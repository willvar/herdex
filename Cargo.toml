[package]
name = "herdex"
version = "0.1.0"
edition = "2021"
description = "codex-only account pool gateway (Rust port of herdex-go)"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls-pemfile = "2"
get_if_addrs = "0.5"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
# TLS 指纹同源：与 codex-rs Cargo.lock 逐版本一致
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-native-roots", "cookies", "json", "stream"] }
rustls = { version = "=0.23.36", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
futures-util = "0.3"
async-stream = "0.3"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
url = "2"
http = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
strip = true
lto = true
